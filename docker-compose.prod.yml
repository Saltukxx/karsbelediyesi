# Kars Belediyesi — production compose (Hetzner, gbsoftt.com sunucusu)
#
# Oltu/Yakutiye stack'lerinden tamamen bağımsızdır:
#   - Kendi compose projesi (kars-platform) → kendi network'ü ve volume'ları
#   - Postgres/Redis host'a port AÇMAZ (yalnızca stack içi)
#   - Web yalnızca docker köprüsü (172.17.0.1:8003) üzerinden yayınlanır; dışarıya edge nginx proxy'ler
#
# Kullanım (sunucuda /opt/kars-platform içinde):
#   docker compose -f docker-compose.prod.yml up -d --build     # postgres+redis+web
#   docker compose -f docker-compose.prod.yml run --rm db-init  # ilk kurulum: şema + seed
#   docker compose -f docker-compose.prod.yml --profile bot up -d whatsapp-bot  # bot (opsiyonel)

name: kars-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: kars-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: kars_belediyesi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kars -d kars_belediyesi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kars-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: kars-web:latest
    container_name: kars-web
    restart: unless-stopped
    ports:
      # Yalnızca docker köprü arayüzüne bağlanır: edge nginx (oltu-platform)
      # 172.17.0.1:8003 üzerinden proxy'ler; internete açık değildir.
      - "172.17.0.1:8003:3000"
    environment:
      DATABASE_URL: postgresql://kars:${POSTGRES_PASSWORD}@postgres:5432/kars_belediyesi
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET .env dosyasinda tanimli olmali}
      AUTH_URL: ${AUTH_URL:-https://karsbelediyesi.gbsoftt.com}
      AUTH_TRUST_HOST: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasinda tanimli olmali}
      UPLOAD_DIR: /app/uploads
      WHATSAPP_BOT_MEDIA_PATH: /app/whatsapp-data/media
    volumes:
      - uploads-data:/app/uploads
      - whatsapp-data:/app/whatsapp-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # İlk kurulum / şema güncellemesi: builder aşamasında prisma CLI + tsx mevcut.
  # `docker compose -f docker-compose.prod.yml run --rm db-init`
  db-init:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    image: kars-web-builder:latest
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://kars:${POSTGRES_PASSWORD}@postgres:5432/kars_belediyesi
    # --accept-data-loss: yeni unique constraint / kolon değişikliklerinde
    # Prisma etkileşimli onay ister; prod deploy non-interactive olduğu için açıkça verilir.
    command: sh -c "npm run push --workspace=packages/db -- --accept-data-loss && npm run db:seed"
    depends_on:
      postgres:
        condition: service_healthy

  whatsapp-bot:
    build:
      context: .
      dockerfile: apps/whatsapp-bot/Dockerfile
    image: kars-whatsapp-bot:latest
    container_name: kars-whatsapp-bot
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kars:${POSTGRES_PASSWORD}@postgres:5432/kars_belediyesi
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TUNED_MODEL: ${GEMINI_TUNED_MODEL:-}
      WHATSAPP_AUTO_CONFIDENCE_THRESHOLD: ${WHATSAPP_AUTO_CONFIDENCE_THRESHOLD:-0.75}
    volumes:
      - whatsapp-data:/app/apps/whatsapp-bot/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["bot"]

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  whatsapp-data:
