name: KarsPanel
options:
  bundleIdPrefix: tr.gov.kars
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KarsPanel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - KarsPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.gov.kars.panel
        PRODUCT_NAME: KarsPanel
        INFOPLIST_KEY_CFBundleDisplayName: KarsPanel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ENABLE_TESTABILITY: YES
    info:
      path: KarsPanel/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: Göreve en yakın aracın belirlenebilmesi ve saha konumunun panele iletilmesi için konumunuz kullanılır.
        NSCameraUsageDescription: Şikayet kapanış ve yol engeli fotoğrafları çekmek için kamera kullanılır.
        NSPhotoLibraryUsageDescription: Şikayet ve engel kayıtlarına eklemek üzere galeriden fotoğraf seçilir.
        NSPhotoLibraryAddUsageDescription: Rapor ve Excel çıktıları Fotoğraflar’a kaydedilebilir.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  KarsPanelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - KarsPanelTests
    dependencies:
      - target: KarsPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.gov.kars.panel.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KarsPanel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KarsPanel"
        BUNDLE_LOADER: "$(TEST_HOST)"
  KarsPanelUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - KarsPanelUITests
    dependencies:
      - target: KarsPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.gov.kars.panel.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KarsPanel
